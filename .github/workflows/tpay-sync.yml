name: tpay 매출 데이터 동기화
on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '0 18 * * *'   # 매일 KST 03:00(UTC 18:00) — 상품분류 매핑은 자주 안 바뀌므로 하루 1번만
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill
          - product-backfill
          - product-category
          - debug
          - debug-order
          - compare
          - product-compare
      rolling_days:
        description: 'backfill 모드일 때 조회할 일수'
        required: false
        default: '90'
      product_rolling_days:
        description: 'product-backfill 모드일 때 조회할 일수 (용량 문제로 기본 90일 권장)'
        required: false
        default: '90'
      debug_shop_no:
        description: 'debug/debug-order/compare 모드일 때 테스트할 매장코드'
        required: false
        default: 'BHD055'
      debug_days:
        description: 'debug 모드일 때 조회할 일수 (범위 제한 테스트용)'
        required: false
        default: '7'
      debug_date:
        description: 'debug-order/compare 모드일 때 조회할 날짜 (yyyymmdd, 정산 끝난 과거 날짜 권장)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: tpay-sync-${{ github.event.inputs.mode || 'daily' }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 일일 갱신 실행 (스케줄 or 수동-daily)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'daily'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
        run: node scripts/daily-update.js
      - name: 상품별 일일 갱신 실행 (스케줄 or 수동-daily)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'daily'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
        run: node scripts/product-daily-update.js
      - name: 상품분류 매핑 갱신 (매일 1회 스케줄 or 수동-product-category)
        if: github.event.schedule == '0 18 * * *' || github.event.inputs.mode == 'product-category'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
        run: node scripts/product-category.js
      - name: 백필 실행 (수동-backfill)
        if: github.event.inputs.mode == 'backfill'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          ROLLING_DAYS: ${{ github.event.inputs.rolling_days }}
        run: node scripts/backfill.js
      - name: 상품별 백필 실행 (수동-product-backfill)
        if: github.event.inputs.mode == 'product-backfill'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          PRODUCT_ROLLING_DAYS: ${{ github.event.inputs.product_rolling_days }}
        run: node scripts/product-backfill.js
      - name: 진단 실행 (수동-debug, 원본 응답 확인용)
        if: github.event.inputs.mode == 'debug'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DAYS: ${{ github.event.inputs.debug_days }}
        run: node scripts/debug-single-store.js
      - name: 주문내역 진단 실행 (수동-debug-order, REQ_CODE 6 원본 확인용)
        if: github.event.inputs.mode == 'debug-order'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DATE: ${{ github.event.inputs.debug_date }}
        run: node scripts/debug-order-detail.js
      - name: 실시간 소스 검증 실행 (수동-compare, REQ_CODE 3 vs 4 비교)
        if: github.event.inputs.mode == 'compare'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DATE: ${{ github.event.inputs.debug_date }}
        run: node scripts/debug-realtime-compare.js
      - name: 상품별 실시간 소스 검증 실행 (수동-product-compare, REQ_CODE 5 vs 6 비교)
        if: github.event.inputs.mode == 'product-compare'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DATE: ${{ github.event.inputs.debug_date }}
        run: node scripts/product-realtime-compare.js
      - name: 변경사항 커밋 & 푸시
        if: github.event.inputs.mode != 'debug' && github.event.inputs.mode != 'debug-order' && github.event.inputs.mode != 'compare' && github.event.inputs.mode != 'product-compare'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-daily.json data/product-daily.json data/receipt-today.json
          if [ -f data/product-category.json ]; then git add data/product-category.json; fi
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: tpay 매출 데이터 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "푸시 실패, 재시도 ($i/3)..."
              sleep 5
            done
          fi
