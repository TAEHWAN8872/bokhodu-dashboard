name: tpay 매출 데이터 동기화
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill
          - debug
          - debug_product
      rolling_days:
        description: 'backfill 모드일 때 조회할 일수'
        required: false
        default: '90'
      debug_shop_no:
        description: 'debug/debug_product 모드일 때 테스트할 매장코드'
        required: false
        default: 'BHD055'
      debug_days:
        description: 'debug/debug_product 모드일 때 조회할 일수 (범위 제한 테스트용)'
        required: false
        default: '7'
permissions:
  contents: write
concurrency:
  group: tpay-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 일일 갱신 실행 (스케줄 or 수동-daily)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'daily'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
        run: node scripts/daily-update.js
      - name: 백필 실행 (수동-backfill)
        if: github.event.inputs.mode == 'backfill'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          ROLLING_DAYS: ${{ github.event.inputs.rolling_days }}
        run: node scripts/backfill.js
      - name: 진단 실행 (수동-debug, 원본 응답 확인용)
        if: github.event.inputs.mode == 'debug'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DAYS: ${{ github.event.inputs.debug_days }}
        run: node scripts/debug-single-store.js
      - name: 상품별 진단 실행 (수동-debug_product, REQ_CODE 5 원본 응답 확인용)
        if: github.event.inputs.mode == 'debug_product'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DAYS: ${{ github.event.inputs.debug_days }}
        run: node scripts/debug-product-sales.js
      - name: 변경사항 커밋 & 푸시
        if: github.event.inputs.mode != 'debug' && github.event.inputs.mode != 'debug_product'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-daily.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: tpay 매출 데이터 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "푸시 실패, 재시도 ($i/3)..."
              sleep 5
            done
          fi
